<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boru TV Player Pro</title>
    <style>
        /* Eski CSS kodlarınızın hepsi buraya gelecek. Yer kaplamaması adına kırpmıyorum, olduğu gibi yapıştırın */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #videoElement { width: 100%; height: 100%; background: #000; object-fit: contain; }
        .epg-container { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(20, 20, 35, 0.85); backdrop-filter: blur(10px); border-radius: 40px; padding: 12px 20px; border: 1px solid #00a8ff; z-index: 10; display: flex; align-items: center; gap: 15px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .epg-container.visible { opacity: 1; pointer-events: auto; }
        .epg-channel-logo { width: 55px; height: 55px; border-radius: 12px; object-fit: contain; background: rgba(0,0,0,0.3); }
        .epg-content { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .epg-top-row { display: flex; align-items: center; gap: 10px; }
        .now-badge { background: #00ff88; color: #000; font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; }
        .now-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .quality-badge { background: rgba(0, 0, 0, 0.5); color: #00ff88; padding: 3px 10px; border-radius: 20px; font-size: 11px; border: 1px solid #00a8ff; }
        .channel-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 20; display: none; opacity: 0; transition: opacity 0.2s ease; }
        .channel-overlay.visible { display: block; opacity: 1; }
        .channel-list-container { position: fixed; top: 15px; left: 15px; bottom: 15px; width: 550px; background: rgba(18, 18, 28, 0.85); backdrop-filter: blur(8px); border: 2px solid #00a8ff; border-radius: 30px; display: flex; flex-direction: row; transform: translateX(-120%); transition: transform 0.2s ease; }
        .channel-overlay.visible .channel-list-container { transform: translateX(0); }
        .channel-list-header { position: absolute; top: 0; left: 120px; right: 0; height: 50px; background: rgba(10, 10, 18, 0.98); border-bottom: 2px solid #00a8ff; display: flex; align-items: center; padding: 0 15px; z-index: 15; border-top-right-radius: 28px; }
        .channel-list-header h3 { color: #00a8ff; font-size: 18px; }
        .category-bar { width: 120px; background: rgba(18, 18, 28, 0.95); border-right: 2px solid #00a8ff; display: flex; flex-direction: column; overflow-y: auto; padding: 60px 0 15px 0; z-index: 10; }
        .category-item { color: #aaa; font-size: 13px; font-weight: 600; padding: 12px 10px; cursor: pointer; margin: 2px 0; outline: none; border: 2px solid transparent; border-radius: 0 20px 20px 0;}
        .category-item.selected, .category-item:focus { color: #00a8ff; background: rgba(0, 168, 255, 0.1); border-color: #00a8ff; }
        .channel-list { flex: 1; overflow-y: auto; padding: 60px 12px 12px 12px; width: calc(100% - 120px); }
        .channel-item { display: flex; align-items: center; padding: 6px 8px; margin-bottom: 4px; border-radius: 18px; cursor: pointer; border: 2px solid transparent; outline: none; position: relative;}
        .channel-item.selected, .channel-item:focus { border-color: #00a8ff; background: rgba(0, 168, 255, 0.1); }
        .channel-number { display: flex; align-items: center; justify-content: center; min-width: 36px; height: 26px; background: rgba(255,255,255,0.05); border-radius: 13px; margin-right: 8px; font-size: 13px; color: #aaa;}
        .channel-item.selected .channel-number { background: rgba(0, 168, 255, 0.2); color: #00a8ff; border-color: #00a8ff; }
        .channel-logo { width: 40px; height: 40px; border-radius: 12px; margin-right: 10px; object-fit: contain; }
        .channel-name { font-size: 13px; color: #aaa; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item.selected .channel-name { color: #00a8ff; }
        
        /* Token Hata Ekranı */
        #accessDenied { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ff3333; text-align: center; }
        #accessDenied h1 { font-size: 40px; margin-bottom: 10px; }
        #accessDenied p { font-size: 18px; color: #aaa; }
        .hidden { display: none !important; }
        
        /* Yükleniyor Ekranı */
        #loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00a8ff; font-size: 20px; z-index: 50; }
    </style>
</head>
<body>

    <!-- TOKEN KONTROL EKRANI -->
    <div id="accessDenied" class="hidden">
        <h1>⛔ Erişim Reddedildi</h1>
        <p>Geçersiz veya eksik token. Lütfen doğru bağlantı adresi ile giriş yapın.</p>
    </div>

    <!-- OYNATICI VE ARAYÜZ (Başlangıçta Gizli) -->
    <div id="appContainer" class="hidden">
        <div id="loader">Kanal Listesi Yükleniyor...</div>
        
        <div class="video-container" id="videoContainer">
            <video id="videoElement" playsinline autoplay preload="auto" x-webkit-airplay="allow" webkit-playsinline></video>
        </div>
        
        <div class="epg-container" id="epgContainer">
            <img id="epgChannelLogo" class="epg-channel-logo" src="">
            <div class="epg-content">
                <div class="epg-top-row">
                    <span class="now-badge">ŞİMDİ</span>
                    <span class="now-title">Kanal seçin</span>
                    <span class="quality-badge" id="qualityBadge">HD</span>
                </div>
            </div>
        </div>
        
        <div class="channel-overlay" id="channelOverlay">
            <div class="channel-list-container">
                <div class="channel-list-header">
                    <h3>📺 BoruTV Pro <span>•</span> Live</h3>
                </div>
                <div class="category-bar" id="categoryBar"></div>
                <div class="channel-list" id="channelList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
    <script>
        // 1. TOKEN KONTROLÜ (GÜVENLİK)
        const urlParams = new URLSearchParams(window.location.search);
        const userToken = urlParams.get('token');
        const VALID_TOKEN = 'fazla-kurcalama-elinde-kalir';

        if (userToken !== VALID_TOKEN) {
            // Token yanlışsa hata ekranını göster, uygulamayı durdur
            document.getElementById('accessDenied').classList.remove('hidden');
            throw new Error("Yetkisiz Erişim"); 
        } else {
            // Token doğruysa oynatıcıyı görünür yap
            document.getElementById('appContainer').classList.remove('hidden');
        }

        // 2. DEĞİŞKENLER
        let channelsData = {};
        const categoryOrder =["ULUSAL", "ULUSAL HABER", "BELGESEL", "SİNEMA VE DİZİ", "SPOR", "YABANCI", "ÇOCUK", "MÜZİK"];
        
        const video = document.getElementById('videoElement');
        const channelOverlay = document.getElementById('channelOverlay');
        const channelList = document.getElementById('channelList');
        const categoryBar = document.getElementById('categoryBar');
        const epgContainer = document.getElementById('epgContainer');
        const loader = document.getElementById('loader');
        
        let hls = null;
        let currentChannelIndex = 0;
        let items =[];
        let isMenuOpen = false;

        // 3. JSON DOSYASINI DIŞARIDAN FETCH İLE ÇEKME (YENİ ÖZELLİK)
        async function fetchChannels() {
            try {
                // Aynı klasördeki channels.json dosyasını okur
                const response = await fetch('channels.json');
                if (!response.ok) throw new Error('Ağ hatası');
                
                channelsData = await response.json();
                loader.classList.add('hidden'); // Yükleniyor yazısını gizle
                renderChannels(); // Menüyü oluştur
                
                // İlk kanalı otomatik aç
                const firstCategory = Object.keys(channelsData)[0];
                if (firstCategory && channelsData[firstCategory].length > 0) {
                    changeChannel(channelsData[firstCategory][0]);
                }
            } catch (error) {
                loader.textContent = "Kanal listesi yüklenemedi!";
                console.error("JSON Çekme Hatası:", error);
            }
        }

        // 4. KANALLARI EKRANA BASTIRMA
        function renderChannels() {
            channelList.innerHTML = '';
            categoryBar.innerHTML = '';
            items =[];
            
            const allGroups = Object.keys(channelsData);
            
            allGroups.forEach(group => {
                // Kategori Butonu Ekle
                const catDiv = document.createElement('div');
                catDiv.className = 'category-item';
                catDiv.textContent = group;
                catDiv.onclick = () => filterChannelsByGroup(group);
                categoryBar.appendChild(catDiv);

                // Kanalları Ekle
                const filtered = channelsData[group];
                filtered.forEach(ch => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.dataset.group = group;
                    div.tabIndex = 0;
                    div.innerHTML = `
                        <span class="channel-number">${ch.number}</span>
                        <img src="${ch.logo}" class="channel-logo">
                        <span class="channel-name">${ch.name}</span>
                    `;
                    div.onclick = () => {
                        changeChannel(ch);
                        closeMenu();
                    };
                    channelList.appendChild(div);
                    items.push(div);
                });
            });
        }

        // 5. KATEGORİ FİLTRELEME
        function filterChannelsByGroup(group) {
            items.forEach(item => {
                if (item.dataset.group === group) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // 6. YAYIN OYNATMA (HLS)
        function changeChannel(ch) {
            document.querySelector('.now-title').textContent = ch.name;
            document.getElementById('epgChannelLogo').src = ch.logo;
            epgContainer.classList.add('visible');
            setTimeout(() => epgContainer.classList.remove('visible'), 5000);

            if (hls) { hls.destroy(); }
            
            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 30 });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play();
            }
        }

        // 7. MENÜ KONTROLLERİ VE KUMANDA TUŞLARI
        function openMenu() {
            channelOverlay.classList.add('visible');
            isMenuOpen = true;
            if(items.length > 0) items[0].focus();
        }
        function closeMenu() {
            channelOverlay.classList.remove('visible');
            isMenuOpen = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Enter') {
                if (!isMenuOpen) openMenu();
            } else if (e.key === 'Escape' || e.key === 'Backspace') {
                closeMenu();
            }
        });

        // Oynatıcıyı başlat
        fetchChannels();

    </script>
</body>
</html>
